name: Atualizar painel de imóveis

on:
  schedule:
    - cron: '0 12 * * 1'      # toda segunda 12:00 UTC = 09:00 em Brasília
  workflow_dispatch:            # permite disparar manualmente pela aba Actions

permissions:
  contents: write               # deixa o job publicar (commit/push) com o token embutido

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar, deduplicar e gerar o mapa
        # update.py --no-push roda scrape.py + health check + build.py.
        # Se um portal cair abaixo do esperado, ele sai com erro e o job FALHA
        # (o GitHub te envia e-mail automaticamente).
        run: python update.py --no-push

      - name: Publicar se houve mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Atualiza dados (automático via GitHub Actions)"
            git push
            echo "Publicado."
          else
            echo "Nada mudou desde a última execução."
          fi
