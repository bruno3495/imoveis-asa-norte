name: Vigia de atualização

# Não coleta nada (o wimoveis bloqueia IP de nuvem). Apenas verifica se a
# atualização LOCAL (Tarefa Agendada do Windows) rodou nos últimos dias.
# Se ficar muito tempo sem rodar, o job FALHA e o GitHub envia e-mail.

on:
  schedule:
    - cron: '0 18 * * 3'      # toda quarta 18:00 UTC (15:00 em Brasília)
  workflow_dispatch:           # permite testar manualmente

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Conferir frescor da última atualização
        run: |
          # Le raw_meta.json, que o scrape.py escreve a CADA coleta bem-sucedida
          # (manual ou agendada). Antes lia last_run.txt, so escrito pelo update.py,
          # e por isso acusava atraso mesmo apos uma atualizacao manual.
          if [ -f raw_meta.json ]; then
            data=$(python -c "import json;print(json.load(open('raw_meta.json'))['coletado_em'])")
          elif [ -f last_run.txt ]; then
            data=$(head -c 10 last_run.txt)
          else
            echo "::error::Sem raw_meta.json nem last_run.txt — nenhuma coleta registrou sucesso."
            exit 1
          fi
          echo "Última coleta registrada: $data"
          dias=$(( ( $(date +%s) - $(date -d "$data" +%s) ) / 86400 ))
          echo "Faz $dias dia(s)."
          if [ "$dias" -gt 9 ]; then
            echo "::error::O painel não é atualizado há $dias dias (limite: 9). Verifique se o PC ligou e se a Tarefa Agendada 'Atualizar Imoveis Asa Norte' rodou (veja update.log; a causa mais comum é o PC ainda estar sem DNS na hora)."
            exit 1
          fi
          echo "OK — atualizado dentro do prazo."
